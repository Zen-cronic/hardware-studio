[project]
name = "hardware-studio-cad"
version = "0.1.0"
description = "Revision-bound parametric CAD build packages"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery>=2.6,<2.7"]

[tool.poetry]
packages = [{include = "cad"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
