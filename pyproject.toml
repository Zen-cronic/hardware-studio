[project]
name = "hardware-studio-cad"
version = "0.1.0"
description = "Revision-bound parametric CAD build packages"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery>=2.6,<2.7", "scikit-fem (==12.0.2)", "netgen-mesher (==6.2.2608)", "trimesh (>=4.6,<5)", "scipy (>=1.15,<2)", "open3d (==0.19.0)"]

[tool.poetry]
packages = [{include = "cad"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
